info:
  name: Listar Produtos (Catálogo) ADMIN
  type: http
  seq: 5

http:
  method: GET
  url: "{{host}}product?activeOnly=false"
  params:
    - name: activeOnly
      value: "false"
      type: query
  auth:
    type: bearer
    token: "{{tokenADMIN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
