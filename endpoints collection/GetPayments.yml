info:
  name: Obter Histórico de Pagamentos (Paginado)
  type: http
  seq: 14

http:
  method: GET
  url: "{{localhost}}api/payments"
  body:
    type: none
  query:
    page: 0
    size: 10
    sort: createdAt,desc
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
