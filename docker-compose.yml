# ==============================================================================
# Docker Compose para Implantação e Execução Local do Ecossistema TCC
# ==============================================================================
# Sobe de forma orquestrada o banco de dados PostgreSQL e o backend tcc-server
# garantindo consistência, healthchecks ativos e variáveis sincronizadas.
# ==============================================================================

services:

  # Banco de Dados Relacional PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: tcc-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tcc_db}
      POSTGRES_USER: ${POSTGRESSQL_USER:-tcc_user}
      POSTGRES_PASSWORD: ${POSTGRESSQL_PASSWORD:-tcc_pass}
    ports:
      - "5432:5432" # Expõe a porta para auditoria via DBeaver / pgAdmin / DataGrip
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESSQL_USER:-tcc_user} -d ${POSTGRES_DB:-tcc_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tcc-network

  # Backend Spring Boot (tcc-server)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tcc-backend-app
    restart: unless-stopped
    ports:
      - "8080:8080" # Expõe as rotas REST e Swagger UI para o frontend
    environment:
      # Perfil ativo do Spring e Porta
      ACTIVE_PROFILE: ${ACTIVE_PROFILE:-dev}
      PORT: ${PORT:-8080}

      # Configurações de Conexão com o Banco de Dados
      POSTGRESSQL_URL: ${POSTGRESSQL_URL:-jdbc:postgresql://db:5432/tcc_db}
      POSTGRESSQL_USER: ${POSTGRESSQL_USER:-tcc_user}
      POSTGRESSQL_PASSWORD: ${POSTGRESSQL_PASSWORD:-tcc_pass}

      # Configurações de Segurança e JWT
      JWT_SECRET: ${JWT_SECRET:-my-secret-key-tcc-server-123456789-secret-token}
      JWT_ISSUER: ${JWT_ISSUER:-pagtesouro-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-20}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@ifnmg.edu.br}

      # Integração com a API do PagTesouro da STN
      PAGTESOURO_BASE_URL: ${PAGTESOURO_BASE_URL:-https://valpagtesouro.tesouro.gov.br}
      PAGTESOURO_TOKEN: ${PAGTESOURO_TOKEN:-${PAGTESOURO_TOKEN_SALINAS:-}}
      PAGTESOURO_URL_NOTIFICACAO: ${PAGTESOURO_URL_NOTIFICACAO:-http://localhost:8080/api/payments/webhook}

      # Daemon Failsafe de Conciliação Automática (Padrão: A cada 1 hora)
      PAGTESOURO_DAEMON_CRON: ${PAGTESOURO_DAEMON_CRON:-0 0 * * * *}

      # Expiração Automática de Pedidos Abandonados (Padrão: 10 dias)
      ORDER_ABANDONED_EXPIRATION_DAYS: ${ORDER_ABANDONED_EXPIRATION_DAYS:-10}
    depends_on:
      db:
        condition: service_healthy # Aguarda o PostgreSQL estar totalmente operacional
    networks:
      - tcc-network

networks:
  tcc-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
