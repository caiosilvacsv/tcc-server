spring.application.name=tcc-server
spring.profiles.active=${ACTIVE_PROFILE:dev}

server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.datasource.url=${POSTGRESSQL_URL:${SPRING_DATASOURCE_URL:}}
spring.datasource.username=${POSTGRESSQL_USER:${SPRING_DATASOURCE_USERNAME:}}
spring.datasource.password=${POSTGRESSQL_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=10000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

api.security.token.secret=${JWT_SECRET:my-secret-key}
api.security.token.issuer=${JWT_ISSUER:pagtesouro-api}
api.security.token.audience=${JWT_AUDIENCE:api}
api.security.token.expiration-time-in-minutes=${JWT_EXPIRATION_MINUTES:20}
api.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
api.security.initial-admin-email=${INITIAL_ADMIN_EMAIL:}
api.security.cookie.secure=${COOKIE_SECURE:false}

api.pagtesouro.base_url = ${PAGTESOURO_BASE_URL:https://valpagtesouro.tesouro.gov.br}
api.pagtesouro.token = ${PAGTESOURO_TOKEN:${PAGTESOURO_TOKEN_SALINAS:}}
api.pagtesouro.url_notificacao = ${PAGTESOURO_URL_NOTIFICACAO:}
api.pagtesouro.notification-domains=${PAGTESOURO_NOTIFICATION_DOMAINS:.gov.br,.edu.br}

# Configuração do Cron para o Daemon de Conciliação Failsafe do PagTesouro (Padrão: A cada hora)
api.pagtesouro.daemon.cron=${PAGTESOURO_DAEMON_CRON:0 0 * * * *}

# Prazo em dias para expiração automática de pedidos abandonados pelo Daemon
api.order.abandoned-expiration-days=${ORDER_ABANDONED_EXPIRATION_DAYS:10}

# Configurações do Spring Boot Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.mail.enabled=false

# Configurações de Envio de E-mail (Gmail / SMTP Universal)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:nao-responda@ifnmg.edu.br}
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:3000/reset-password}

# Configuração OpenAPI 3 / Swagger UI - Rota unificada para acesso direto
springdoc.swagger-ui.path=/swagger

# -------------------------------------------------------------
# Suporte a Proxy Reverso (Nginx / OCI Load Balancer)
# -------------------------------------------------------------
# Faz o Spring reconhecer os cabeçalhos de encaminhamento (X-Forwarded-For,
# X-Forwarded-Proto, X-Forwarded-Host), garantindo que o IP real do cliente
# seja auditado e que os cookies de autenticação HttpOnly sejam emitidos
# com a flag 'Secure' em conexões HTTPS terminadas no proxy.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
