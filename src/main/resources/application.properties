spring.application.name=tcc-server
spring.profiles.active=${ACTIVE_PROFILE:dev}

server.port=${PORT:8080}

spring.datasource.url=${POSTGRESSQL_URL:${SPRING_DATASOURCE_URL:}}
spring.datasource.username=${POSTGRESSQL_USER:${SPRING_DATASOURCE_USERNAME:}}
spring.datasource.password=${POSTGRESSQL_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=10000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

api.security.token.secret=${JWT_SECRET:my-secret-key}
api.security.token.issuer=${JWT_ISSUER:pagtesouro-api}
api.security.token.audience=${JWT_AUDIENCE:api}
api.security.token.expiration-time-in-minutes=${JWT_EXPIRATION_MINUTES:20}
api.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
api.security.initial-admin-email=${INITIAL_ADMIN_EMAIL:}
api.pagtesouro.base_url = ${PAGTESOURO_BASE_URL:https://valpagtesouro.tesouro.gov.br}
api.pagtesouro.token = ${PAGTESOURO_TOKEN:${PAGTESOURO_TOKEN_SALINAS:}}
api.pagtesouro.url_notificacao = ${PAGTESOURO_URL_NOTIFICACAO:}

# Configuração do Cron para o Daemon de Conciliação Failsafe do PagTesouro (Padrão: A cada hora)
api.pagtesouro.daemon.cron=${PAGTESOURO_DAEMON_CRON:0 0 * * * *}

# Prazo em dias para expiração automática de pedidos abandonados pelo Daemon
api.order.abandoned-expiration-days=${ORDER_ABANDONED_EXPIRATION_DAYS:10}

# Configuração OpenAPI 3 / Swagger UI - Rota unificada para acesso direto
springdoc.swagger-ui.path=/swagger